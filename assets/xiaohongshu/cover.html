<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 900px;
  height: 1200px;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 60px;
  position: relative;
  overflow: hidden;
}
.bg-circle {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.3;
}
.c1 { width: 500px; height: 500px; background: #e94560; top: -100px; right: -100px; }
.c2 { width: 400px; height: 400px; background: #533483; bottom: -50px; left: -50px; }
.icon {
  font-size: 120px;
  margin-bottom: 40px;
  z-index: 1;
}
.tag {
  background: rgba(233, 69, 96, 0.2);
  border: 1px solid #e94560;
  color: #e94560;
  padding: 8px 24px;
  border-radius: 20px;
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 30px;
  z-index: 1;
}
.title {
  font-size: 72px;
  font-weight: 800;
  text-align: center;
  line-height: 1.2;
  margin-bottom: 30px;
  z-index: 1;
  text-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.subtitle {
  font-size: 36px;
  color: #a0a0a0;
  text-align: center;
  line-height: 1.5;
  margin-bottom: 60px;
  z-index: 1;
}
.highlight {
  color: #e94560;
  font-weight: 700;
}
.features {
  display: flex;
  gap: 30px;
  z-index: 1;
}
.feature-item {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 24px 32px;
  text-align: center;
}
.feature-icon { font-size: 40px; margin-bottom: 12px; }
.feature-text { font-size: 24px; color: #ccc; }
.bottom-bar {
  position: absolute;
  bottom: 40px;
  font-size: 22px;
  color: #666;
  z-index: 1;
}
</style>
</head>
<body>
<div class="bg-circle c1"></div>
<div class="bg-circle c2"></div>
<div class="icon">🔒</div>
<div class="tag">AI PC · 本地隐私保护</div>
<div class="title">让敏感文件<br><span class="highlight">不出电脑</span></div>
<div class="subtitle">我做了一个本地 AI 隐私检查 Skill<br>文件外发前，自动发现敏感信息</div>
<div class="features">
  <div class="feature-item">
    <div class="feature-icon">📁</div>
    <div class="feature-text">10种文件格式</div>
  </div>
  <div class="feature-item">
    <div class="feature-icon">🔍</div>
    <div class="feature-text">18+ 敏感类型</div>
  </div>
  <div class="feature-item">
    <div class="feature-icon">🛡️</div>
    <div class="feature-text">默认脱敏</div>
  </div>
</div>
<div class="bottom-bar">ModelScope AI PC Agent Skills 参赛作品</div>
</body>
</html>
