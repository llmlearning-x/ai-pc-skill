<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 900px;
  height: 1200px;
  background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 60px;
  position: relative;
  overflow: hidden;
}
.bg-circle {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.3;
}
.c1 { width: 500px; height: 500px; background: #36d1dc; top: -100px; right: -100px; }
.c2 { width: 400px; height: 400px; background: #5b86e5; bottom: -50px; left: -50px; }
.icon {
  font-size: 120px;
  margin-bottom: 40px;
  z-index: 1;
}
.tag {
  background: rgba(54, 209, 220, 0.15);
  border: 1px solid #36d1dc;
  color: #36d1dc;
  padding: 8px 24px;
  border-radius: 20px;
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 30px;
  z-index: 1;
}
.title {
  font-size: 68px;
  font-weight: 800;
  text-align: center;
  line-height: 1.2;
  margin-bottom: 30px;
  z-index: 1;
  text-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.subtitle {
  font-size: 34px;
  color: #b8c6cc;
  text-align: center;
  line-height: 1.5;
  margin-bottom: 60px;
  z-index: 1;
}
.highlight {
  color: #36d1dc;
  font-weight: 700;
}
.features {
  display: flex;
  gap: 30px;
  z-index: 1;
}
.feature-item {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 24px 32px;
  text-align: center;
}
.feature-icon { font-size: 40px; margin-bottom: 12px; }
.feature-text { font-size: 24px; color: #ccc; }
.bottom-bar {
  position: absolute;
  bottom: 40px;
  font-size: 22px;
  color: #7a8a91;
  z-index: 1;
}
</style>
</head>
<body>
<div class="bg-circle c1"></div>
<div class="bg-circle c2"></div>
<div class="icon">🩺</div>
<div class="tag">AI PC · OpenVINO 性能体检</div>
<div class="title">你的电脑能跑<br><span class="highlight">本地大模型</span>吗？</div>
<div class="subtitle">我做了一个 AI PC 体检 Skill<br>能不能跑、跑多大、跑哪个设备、跑多快</div>
<div class="features">
  <div class="feature-item">
    <div class="feature-icon">🧭</div>
    <div class="feature-text">三档体检模式</div>
  </div>
  <div class="feature-item">
    <div class="feature-icon">⚡</div>
    <div class="feature-text">真实跑分实测</div>
  </div>
  <div class="feature-item">
    <div class="feature-icon">🤖</div>
    <div class="feature-text">模型推荐清单</div>
  </div>
</div>
<div class="bottom-bar">ModelScope AI PC Agent Skills 参赛作品</div>
</body>
</html>
