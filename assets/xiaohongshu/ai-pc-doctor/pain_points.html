<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 900px;
  height: 1200px;
  background: linear-gradient(180deg, #203a43 0%, #0f2027 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  color: #fff;
  padding: 60px;
  position: relative;
}
.header {
  font-size: 52px;
  font-weight: 800;
  margin-bottom: 12px;
}
.sub {
  font-size: 28px;
  color: #a0a0a0;
  margin-bottom: 50px;
}
.pain-list {
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.pain {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-left: 6px solid #36d1dc;
  border-radius: 16px;
  padding: 30px 36px;
}
.pain-q {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 10px;
}
.pain-d {
  font-size: 23px;
  color: #aab8be;
  line-height: 1.5;
}
.bottom-box {
  position: absolute;
  bottom: 50px;
  left: 60px;
  right: 60px;
  background: rgba(54, 209, 220, 0.12);
  border: 1px solid rgba(54, 209, 220, 0.35);
  border-radius: 16px;
  padding: 28px;
}
.bottom-title {
  font-size: 26px;
  font-weight: 700;
  color: #36d1dc;
  margin-bottom: 12px;
}
.bottom-text {
  font-size: 23px;
  color: #ccc;
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="header">😵 买了 AI PC 之后的灵魂拷问</div>
<div class="sub">这些问题，你是不是也问过自己？</div>

<div class="pain-list">
  <div class="pain">
    <div class="pain-q">❓ 我的电脑到底算不算 AI PC？</div>
    <div class="pain-d">CPU、GPU、NPU 都有，但 OpenVINO 装没装好、设备认没认出来，心里没数</div>
  </div>
  <div class="pain">
    <div class="pain-q">❓ 能跑多大的模型？7B？14B？</div>
    <div class="pain-d">网上教程抄了一圈，模型下好了，一加载直接爆内存</div>
  </div>
  <div class="pain">
    <div class="pain-q">❓ 模型该放在 CPU、GPU 还是 NPU 上跑？</div>
    <div class="pain-d">理论支持 ≠ 实测支持，不实际跑一遍根本不知道谁会报错</div>
  </div>
  <div class="pain">
    <div class="pain-q">❓ 实际生成速度到底有多快？</div>
    <div class="pain-d">参数看着很美，TTFT、tokens/s 这些真实指标没人告诉你</div>
  </div>
</div>

<div class="bottom-box">
  <div class="bottom-title">🩺 所以需要一个「体检医生」</div>
  <div class="bottom-text">不靠猜、不抄作业，用本机真实数据回答：能不能跑、跑多大、跑哪个设备、跑多快</div>
</div>
</body>
</html>
