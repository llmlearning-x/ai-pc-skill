<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 900px;
  height: 1200px;
  background: linear-gradient(180deg, #203a43 0%, #0f2027 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  color: #fff;
  padding: 60px;
  position: relative;
}
.header {
  font-size: 52px;
  font-weight: 800;
  margin-bottom: 12px;
}
.sub {
  font-size: 28px;
  color: #a0a0a0;
  margin-bottom: 50px;
}
.vs {
  display: flex;
  gap: 24px;
  margin-bottom: 36px;
}
.col {
  flex: 1;
  border-radius: 20px;
  padding: 32px;
}
.col-bad {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.12);
}
.col-good {
  background: rgba(54, 209, 220, 0.1);
  border: 1px solid rgba(54, 209, 220, 0.45);
}
.col-title {
  font-size: 30px;
  font-weight: 800;
  margin-bottom: 24px;
  text-align: center;
}
.col-bad .col-title { color: #8b949e; }
.col-good .col-title { color: #36d1dc; }
.row {
  font-size: 22px;
  color: #ccc;
  line-height: 1.5;
  padding: 12px 0;
  border-bottom: 1px dashed rgba(255,255,255,0.12);
}
.row:last-child { border-bottom: none; }
.bottom-box {
  position: absolute;
  bottom: 50px;
  left: 60px;
  right: 60px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 28px;
}
.bottom-title {
  font-size: 26px;
  font-weight: 700;
  color: #36d1dc;
  margin-bottom: 12px;
}
.bottom-text {
  font-size: 23px;
  color: #ccc;
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="header">💡 为什么要在本地体检？</div>
<div class="sub">抄网上的配置 vs 用本机真实数据说话</div>

<div class="vs">
  <div class="col col-bad">
    <div class="col-title">😵 传统做法</div>
    <div class="row">❌ 看参数表猜能不能跑</div>
    <div class="row">❌ 抄别人的部署教程碰运气</div>
    <div class="row">❌ 下载几个 GB 模型才发现跑不动</div>
    <div class="row">❌ 不知道瓶颈在 CPU 还是 GPU</div>
    <div class="row">❌ 设备列表看着支持，一推理就报错</div>
  </div>
  <div class="col col-good">
    <div class="col-title">🩺 AI PC Doctor</div>
    <div class="row">✅ 本机实测，数据不编造</div>
    <div class="row">✅ 每个设备真实编译 + 推理验证</div>
    <div class="row">✅ 先估算容量，再决定下不下模型</div>
    <div class="row">✅ CPU/GPU/NPU 横向跑分对比</div>
    <div class="row">✅ 全程本地，零数据上传</div>
  </div>
</div>

<div class="bottom-box">
  <div class="bottom-title">🎯 理论支持 ≠ 实测支持</div>
  <div class="bottom-text">AI PC 的价值不是参数，而是「这台机器真实能跑什么」。体检一次，比抄十次作业都有用。</div>
</div>
</body>
</html>
