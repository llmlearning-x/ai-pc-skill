<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 900px;
  height: 1200px;
  background: #f8f9fa;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  padding: 60px;
  position: relative;
}
.header {
  font-size: 52px;
  font-weight: 800;
  color: #1a1a2e;
  margin-bottom: 16px;
}
.sub {
  font-size: 28px;
  color: #666;
  margin-bottom: 50px;
}
.card {
  background: #fff;
  border-radius: 24px;
  padding: 36px;
  margin-bottom: 28px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  border-left: 6px solid #e94560;
}
.card-header {
  display: flex;
  align-items: center;
  margin-bottom: 16px;
}
.card-icon {
  font-size: 44px;
  margin-right: 20px;
}
.card-title {
  font-size: 32px;
  font-weight: 700;
  color: #1a1a2e;
}
.card-desc {
  font-size: 26px;
  color: #555;
  line-height: 1.6;
}
.card-highlight {
  color: #e94560;
  font-weight: 600;
}
.bottom-tip {
  position: absolute;
  bottom: 40px;
  left: 60px;
  right: 60px;
  background: linear-gradient(90deg, #e94560, #533483);
  color: #fff;
  padding: 24px 36px;
  border-radius: 16px;
  font-size: 28px;
  font-weight: 600;
  text-align: center;
}
</style>
</head>
<body>
<div class="header">😰 这些场景你遇到过吗？</div>
<div class="sub">文件发出去之前，从没检查过里面有什么...</div>

<div class="card">
  <div class="card-header">
    <div class="card-icon">📄</div>
    <div class="card-title">合同外发</div>
  </div>
  <div class="card-desc">
    把合同发给客户，里面却藏着<span class="card-highlight">手机号、合同金额、统一社会信用代码</span>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <div class="card-icon">💻</div>
    <div class="card-title">代码上传</div>
  </div>
  <div class="card-desc">
    push 到 GitHub 后才发现 <span class="card-highlight">.env 里还有 API Key</span>，密钥已经暴露
  </div>
</div>

<div class="card">
  <div class="card-header">
    <div class="card-icon">📝</div>
    <div class="card-title">简历投递</div>
  </div>
  <div class="card-desc">
    上传到招聘平台的简历里，<span class="card-highlight">身份证号、详细住址</span> 一览无余
  </div>
</div>

<div class="bottom-tip">☁️ 用云端工具检查？等于先把隐私送给第三方</div>
</body>
</html>
