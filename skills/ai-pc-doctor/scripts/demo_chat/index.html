<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地 AI 助手 · Intel OpenVINO</title>
<style>
  /* ===== Intel Design System ===== */
  :root {
    /* Intel Brand Colors */
    --intel-blue: #0071C5;
    --intel-blue-dark: #004280;
    --intel-blue-light: #00AEEF;
    --intel-cyan: #00C7FD;
    --intel-charcoal: #1D252C;
    --intel-gray-100: #F5F7FA;
    --intel-gray-200: #E2E8F0;
    --intel-gray-300: #C5D0DC;
    --intel-gray-400: #8F9BB3;
    --intel-gray-500: #6B7B8D;
    --intel-white: #FFFFFF;
    --intel-green: #00B050;
    --intel-orange: #F58220;
    --intel-red: #E81123;

    /* Derived */
    --bg: #F5F7FA;
    --panel: #FFFFFF;
    --panel-glass: rgba(255,255,255,0.92);
    --border: #E2E8F0;
    --text: #1D252C;
    --text-secondary: #6B7B8D;
    --text-tertiary: #8F9BB3;
    --user-bubble: linear-gradient(135deg, #0071C5 0%, #004280 100%);
    --user-bubble-solid: #0071C5;
    --ai-bubble: #FFFFFF;
    --ai-text: #1D252C;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: "Inter", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    display: flex;
    justify-content: center;
  }

  /* Intel blue radial glow background */
  .bg-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(0,113,197,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(0,174,239,0.06) 0%, transparent 50%);
  }

  /* ===== App Container ===== */
  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 800px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel-glass);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
  }

  /* ===== Header ===== */
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(12px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .intel-logo {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--intel-blue) 0%, var(--intel-blue-dark) 100%);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 8px rgba(0,113,197,0.3);
  }

  .brand-text .title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }

  .brand-text .sub {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--intel-green);
    box-shadow: 0 0 0 2px rgba(0,176,80,0.2);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(0.9); }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--intel-blue);
    background: rgba(0,113,197,0.08);
    border: 1px solid rgba(0,113,197,0.15);
    border-radius: 20px;
    padding: 5px 12px;
    font-weight: 500;
  }

  .badge-chip .chip-icon {
    font-size: 10px;
  }

  .btn {
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--intel-white);
    border: 1px solid var(--intel-gray-200);
    border-radius: var(--radius-sm);
    padding: 7px 14px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn:hover {
    color: var(--intel-blue);
    border-color: var(--intel-blue-light);
    background: rgba(0,113,197,0.04);
  }

  .btn:active {
    transform: translateY(0.5px);
  }

  /* ===== Chat Area ===== */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  /* Custom scrollbar */
  #chat::-webkit-scrollbar { width: 5px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--intel-gray-300); border-radius: 10px; }
  #chat::-webkit-scrollbar-thumb:hover { background: var(--intel-gray-400); }

  /* Empty state */
  .empty {
    margin: auto;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 13px;
    padding: 40px 20px;
  }

  .empty .intel-welcome-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, rgba(0,113,197,0.1) 0%, rgba(0,174,239,0.1) 100%);
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  .empty .empty-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .empty .hint {
    font-size: 12px;
    line-height: 1.7;
    opacity: 0.8;
  }

  .empty .hint code {
    background: rgba(0,113,197,0.06);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 11px;
    color: var(--intel-blue);
  }

  /* ===== Message Bubbles ===== */
  .msg {
    max-width: 80%;
    display: flex;
    flex-direction: column;
    animation: msgIn 0.3s ease-out;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg.ai {
    align-self: flex-start;
    align-items: flex-start;
  }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }

  .msg.user .msg-row { flex-direction: row-reverse; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
  }

  .msg.user .avatar {
    background: linear-gradient(135deg, var(--intel-blue) 0%, var(--intel-blue-dark) 100%);
    color: white;
  }

  .msg.ai .avatar {
    background: linear-gradient(135deg, #E8F4FD 0%, #D6EDFA 100%);
    color: var(--intel-blue);
  }

  .bubble-col {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .bubble {
    padding: 11px 16px;
    border-radius: var(--radius-md);
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14.5px;
    line-height: 1.65;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s ease;
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,113,197,0.25);
  }

  .msg.ai .bubble {
    background: var(--ai-bubble);
    color: var(--ai-text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .meta {
    font-size: 11px;
    color: var(--text-tertiary);
    padding: 0 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .meta .typing-dots {
    display: flex;
    gap: 3px;
    align-items: center;
  }

  .meta .typing-dots span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--intel-blue-light);
    animation: typingBounce 1.4s ease-in-out infinite;
  }

  .meta .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .meta .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
  }

  /* ===== Input Area ===== */
  footer {
    padding: 14px 24px 18px;
    border-top: 1px solid var(--border);
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(12px);
  }

  .input-bar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--intel-white);
    border: 1px solid var(--intel-gray-200);
    border-radius: var(--radius-md);
    padding: 6px 6px 6px 16px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .input-bar:focus-within {
    border-color: var(--intel-blue-light);
    box-shadow: 0 0 0 3px rgba(0,113,197,0.1), var(--shadow-sm);
  }

  .input-bar textarea {
    flex: 1;
    resize: none;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.6;
    max-height: 120px;
    min-height: 38px;
    color: var(--text);
    outline: none;
    padding: 6px 0;
  }

  .input-bar textarea::placeholder {
    color: var(--text-tertiary);
  }

  .input-actions {
    display: flex;
    align-items: flex-end;
    gap: 6px;
  }

  #send {
    background: linear-gradient(135deg, var(--intel-blue) 0%, var(--intel-blue-dark) 100%);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,113,197,0.25);
  }

  #send:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(0,113,197,0.35);
  }

  #send:active {
    transform: translateY(0);
  }

  #send:disabled {
    background: var(--intel-gray-300);
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  .shortcut-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 8px;
    opacity: 0.7;
  }

  /* ===== Scroll to bottom ===== */
  .scroll-bottom {
    position: absolute;
    bottom: 90px;
    right: 24px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s ease;
    z-index: 10;
    font-size: 16px;
  }

  .scroll-bottom.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ===== Responsive ===== */
  @media (max-width: 600px) {
    .app { max-width: 100%; border: none; }
    header { padding: 14px 16px; }
    #chat { padding: 14px 16px; }
    footer { padding: 10px 16px 14px; }
    .msg { max-width: 88%; }
  }
</style>
</head>
<body>
<div class="bg-glow"></div>

<div class="app">
  <header>
    <div class="brand">
      <div class="intel-logo">Intel</div>
      <div class="brand-text">
        <div class="title">本地 AI 助手</div>
        <div class="sub">
          <span class="status-dot"></span>
          <span id="modelSub">加载中…</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <span class="badge-chip">
        <span class="chip-icon">⚡</span>
        <span id="deviceBadge">CPU</span>
      </span>
      <button class="btn" id="resetBtn">
        <span>↺</span> 清空
      </button>
    </div>
  </header>

  <div id="chat">
    <div class="empty">
      <div class="intel-welcome-icon">🤖</div>
      <div class="empty-title">欢迎使用 Intel 本地 AI 助手</div>
      <div class="hint">
        基于 <code>OpenVINO</code> + <code>Qwen2-0.5B</code>，运行于本机 CPU<br>
        输入消息，AI 将逐字流式生成回复
      </div>
    </div>
  </div>

  <div class="scroll-bottom" id="scrollBottom">↓</div>

  <footer>
    <div class="input-bar">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
      <div class="input-actions">
        <button id="send">发送</button>
      </div>
    </div>
    <div class="shortcut-hint">按 Enter 快速发送 · Shift+Enter 换行</div>
  </footer>
</div>

<script>
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const resetBtn = document.getElementById('resetBtn');
  const modelSub = document.getElementById('modelSub');
  const deviceBadge = document.getElementById('deviceBadge');
  const scrollBottomEl = document.getElementById('scrollBottom');
  let busy = false;

  /* ===== Auto-resize textarea ===== */
  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }
  inputEl.addEventListener('input', autoResize);

  /* ===== Scroll to bottom button ===== */
  chatEl.addEventListener('scroll', () => {
    const nearBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 100;
    scrollBottomEl.classList.toggle('show', !nearBottom);
  });
  scrollBottomEl.addEventListener('click', () => {
    chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: 'smooth' });
  });

  async function loadInfo() {
    try {
      const r = await fetch('/api/info');
      const info = await r.json();
      modelSub.textContent = info.model + ' · 设备 ' + info.device;
      deviceBadge.textContent = info.device;
    } catch (e) {
      modelSub.textContent = '模型信息获取失败';
    }
  }

  function clearEmpty() {
    const empty = chatEl.querySelector('.empty');
    if (empty) empty.remove();
  }

  function addMsg(role, text) {
    clearEmpty();
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;

    const row = document.createElement('div');
    row.className = 'msg-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '我' : 'AI';

    const col = document.createElement('div');
    col.className = 'bubble-col';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    col.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(col);
    msg.appendChild(row);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function createAIMsg() {
    clearEmpty();
    const msg = document.createElement('div');
    msg.className = 'msg ai';

    const row = document.createElement('div');
    row.className = 'msg-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'AI';

    const col = document.createElement('div');
    col.className = 'bubble-col';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span> 正在生成…';

    col.appendChild(bubble);
    col.appendChild(meta);
    row.appendChild(avatar);
    row.appendChild(col);
    msg.appendChild(row);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return { bubble, meta };
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMsg('user', text);
    const { bubble, meta } = createAIMsg();

    let full = '';
    let started = performance.now();
    let firstToken = null;

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        if (chunk) {
          if (firstToken === null) firstToken = performance.now();
          full += chunk;
          bubble.textContent = full;
          chatEl.scrollTop = chatEl.scrollHeight;
        }
      }
      const elapsed = (performance.now() - started) / 1000;
      const ttft = firstToken ? ((firstToken - started) / 1000).toFixed(2) : '0';
      const tokens = full.replace(/\s+/g, ' ').split(' ').filter(Boolean).length;
      const speed = elapsed > 0 ? (tokens / elapsed).toFixed(1) : '0';
      meta.textContent = `首 token ${ttft}s · ${elapsed.toFixed(1)}s · ~${speed} tok/s`;
    } catch (e) {
      bubble.textContent = '[请求失败] ' + e;
      meta.textContent = '';
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function reset() {
    if (busy) return;
    await fetch('/api/reset', { method: 'POST' });
    chatEl.innerHTML = `
      <div class="empty">
        <div class="intel-welcome-icon">🔄</div>
        <div class="empty-title">对话已清空</div>
        <div class="hint">随时输入新消息开始对话</div>
      </div>
    `;
    inputEl.focus();
  }

  sendBtn.addEventListener('click', send);
  resetBtn.addEventListener('click', reset);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  loadInfo();
  inputEl.focus();
</script>
</body>
</html>
